<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Video Tracker</h1>
            <p>Track your favorite videos and their view counts</p>
        </header>

        <div class="add-video-section">
            <h2>➕ Quick Add Video</h2>
            <form id="videoForm">
                <div class="form-group">
                    <input type="text" id="videoTitle" placeholder="Video Title" required autofocus>
                </div>
                <div class="form-group">
                    <input type="url" id="videoUrl" placeholder="Video URL (https://youtube.com/...)" required>
                </div>
                <div class="form-group inline-group">
                    <input type="number" id="videoViews" placeholder="Views" value="0" min="0" required>
                    <button type="submit" class="btn-add">+ Add Video</button>
                </div>
            </form>

            <div class="quick-buttons">
                <button class="quick-btn" onclick="quickAddVideo('Untitled Video', '', 0)">📝 Blank Video</button>
                <button class="quick-btn" onclick="quickAddVideo('New Video', '', 100)">🎯 With 100 Views</button>
                <button class="quick-btn" onclick="quickAddVideo('Viral Video', '', 1000)">🔥 With 1K Views</button>
            </div>
        </div>

        <div class="videos-section">
            <div class="videos-header">
                <h2>📊 Your Videos (Sorted by Views)</h2>
                <span id="totalCount" class="total-count">0 videos</span>
            </div>
            <div id="videosList" class="videos-list">
                <p class="empty-message">No videos added yet. Start tracking! 🚀</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
