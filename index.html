<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Video Tracker</h1>
            <p>Track your favorite videos and their view counts</p>
        </header>

        <div class="add-video-section">
            <h2>Add a Video</h2>
            <form id="videoForm">
                <div class="form-group">
                    <label for="videoTitle">Video Title:</label>
                    <input type="text" id="videoTitle" placeholder="Enter video title" required>
                </div>
                <div class="form-group">
                    <label for="videoUrl">Video URL:</label>
                    <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=..." required>
                </div>
                <div class="form-group">
                    <label for="videoViews">View Count:</label>
                    <input type="number" id="videoViews" placeholder="0" value="0" min="0" required>
                </div>
                <button type="submit" class="btn-add">Add Video</button>
            </form>
        </div>

        <div class="videos-section">
            <h2>Videos (Sorted by Views)</h2>
            <div id="videosList" class="videos-list">
                <p class="empty-message">No videos added yet. Add one to get started!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
